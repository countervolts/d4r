; OptiScaler settings for the d4r Windows drag-in release. Values not listed keep OptiScaler's
; defaults. The DLSS model is chosen in d4r\d4r.ini, not here.
[Upscalers]
Dx12Upscaler=dlss
[FrameGen]
Enabled=false
FGInput=nofg
FGOutput=nofg
[DLSS]
Enabled=true
AllowExternalBackend=true
RenderPresetOverride=false
UseGenericAppIdWithDlss=false
[Libraries]
; Relative to this folder (needs d4r's OptiScaler with patch 0006).
NvngxPath=d4r
NvngxDlssPath=d4r
NvngxFeaturePath=d4r
[Hotfix]
RestoreComputeSignature=false
RestoreGraphicSignature=false
ExtendedStateRestore=false
[Log]
LogToFile=true
LogLevel=2
[Menu]
DisableSplash=true
