; d4r settings for this game (Windows). This file lives in the game's d4r folder and applies to
; this game only. Edit it with Notepad, save, and restart the game. Mistakes are reported in
; d4r\d4r_nvngx.log and by d4r-check.ps1; an invalid value falls back to the default shown here.
;
; Native Ray Reconstruction is experimental and requires a locally generated D/E model.

[DLSS]
; DLSS model:
;
; Model | DLSS | Recommended modes          | Notes
; ------+------+----------------------------+--------------------------------------
; K     | 4    | DLAA / Quality / Balanced  | Default; faster
; M     | 4.5  | Performance                | More demanding
; E     | 3    | Quality / Balanced         | Legacy CNN; no native Windows layer acceleration
; L     | 4.5  | Ultra Performance           | Experimental; not Windows-validated
;
; Select the quality mode (Quality, Performance, ...) in the game or the OptiScaler menu (Insert).
; E and L select NGX preset hints only. They do not enable standalone engine paths.
Model = K
; NVIDIA's library stamps "DLSS SDK - DO NOT DISTRIBUTE" over the image; d4r turns that off.
; true shows it.
ShowWatermark = false

[Interop]
; Experimental: lets the game continue while DLSS runs on the GPU instead of waiting for it.
; Requires a game that uses one D3D12 command queue. Off is the tested setting. Whether it is
; faster depends on the game and has not been measured broadly; turn it off if the game crashes,
; stutters or shows a wrong image.
AsyncInterop = false
; Experimental: submit input conversions/array copies as one ordered GPU batch, retaining
; whole-context completion before NGX. Some synthetic runs are faster, but player temporal
; exactness is unresolved. Keep false until that investigation is complete.
; Missing/invalid values retain the older unbatched behavior. Set false to disable batching.
BatchInputCopies = false

[Debug]
; Check every DLSS output for invalid values (NaN/Inf) on the GPU. Costs some speed; use it only
; when reporting a problem.
ValidateOutput = false
; normal: errors and a summary in d4r\d4r_nvngx.log. verbose: every API call and kernel launch
; (large log; use it only when asked for a bug report).
Log = normal

[Paths]
; Folder for the compiled DLSS kernels. auto = %LOCALAPPDATA%\d4r\cache. The first launch fills it
; and can take several minutes; later launches are quick.
CacheDir = auto
; Optional complete private native kernel directory, generated locally from your DLLs.
; auto uses the packaged kernels. Relative paths resolve beside this d4r.ini.
NativeDir = auto

[Kernels]
; Experimental RDNA4 only. Requires a matching token-lane FP8 M bundle; startup refuses this
; setting if d4r/native/<gfx12>/d4r-native-fp8.txt is absent. Default keeps the FP16 path.
NativeFp8 = false

[RayReconstruction]
; off is the default. native uses the local Vulkan RR engine through native D3D12.
; fsr (experimental) runs AMD's FSR Ray Regeneration denoiser on a private vkd3d-proton device
; (d4r\fsr) and upscales with Super Sampling. install.bat [F] sets it up. A frame that cannot be
; denoised fails; it is never returned noisy.
Backend = off
; auto selects d4r/engine/rr-d. Relative paths resolve beside this d4r.ini.
; Generate the D/E model locally; model data is not bundled in the ZIP.
ModelDir = auto
; Backend = fsr only: AMD's amd_fidelityfx_denoiser_dx12.dll. auto = d4r\amd_fidelityfx_denoiser_dx12.dll.
; AMD's file is not bundled; install.bat downloads the pinned FidelityFX SDK 2.3 binary.
FsrDenoiser = auto
; Backend = fsr only. AMD's temporal stability bias: auto keeps AMD's default of 1, which weights history heavily.
; Measured on d4r's synthetic moving scene (error against the noise-free image): without upscaling 0 is about 3x
; closer than auto (0.036 vs 0.107); after a 2x Super Sampling upscale auto was about 16% closer (0.214 vs 0.248).
; Linux testing on a game capture found 0 closer to DLSS RR. Pick per game; a number >= 0 is allowed.
FsrStabilityBias = auto
; Backend = fsr only. 0-1: share of the colour that skips the denoiser (keeps hair/water/foliage detail, adds grain).
FsrDetail = 0
